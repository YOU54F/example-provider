name: Build

on:
  push:
  workflow_dispatch:

env:
  PACT_BROKER_BASE_URL: https://test.pactflow.io
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  # PACT_BROKER_PUBLISH_VERIFICATION_RESULTS: true
  # GIT_COMMIT: ${{ github.sha }}
  # GITHUB_REF: ${{ github.ref }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
            ubuntu-latest,
            ubuntu-22.04-arm,
            windows-latest,
            windows-11-arm,
            macos-15-intel,
            macos-15
          ]
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Download and install Drift
        if: matrix.os != 'windows-11-arm'
        run: |
          npm install -g @pactflow/drift


      - name: Download and install Drift (win-arm64) # no native win-arm64 drift builds
        if: matrix.os == 'windows-11-arm'
        shell: pwsh
        run: |
          $driftPath = "$env:TEMP\drift"
          New-Item -ItemType Directory -Force -Path $driftPath | Out-Null
          Invoke-WebRequest -Uri "https://download.pactflow.io/drift/latest/windows-x86_64.tgz" -OutFile "$env:TEMP\drift.tgz"
          tar -xz -C $driftPath -f "$env:TEMP\drift.tgz"
          Add-Content $env:GITHUB_PATH $driftPath

      - name: Auth Drift
        run: drift auth login     
 
      - name: Install luarocks (windows)
        if: runner.os == 'Windows'
        run: choco install -y luarocks
      - name: Install luarocks (linux)
        if: runner.os == 'Linux'
        run: sudo apt install luarocks
      - name: Install luarocks (macos)
        if: runner.os == 'MacOS'
        run: brew install luarocks
      - name: Install luarocks deps
        if: runner.os == 'Linux' || matrix.os == 'macos-15-intel'
        run: sudo luarocks install dkjson
      - name: Install luarocks deps
        if: runner.os != 'Linux' && matrix.os != 'macos-15-intel'
        run: luarocks install dkjson

      - name: test lua with dkjson
        if: runner.os == 'Windows'
        run: lua.exe test.lua
      # - name: test lua with dkjson
      #   if: runner.os != 'Windows'
      #   run: lua test.lua


      - name: set lua path
        if: runner.os == 'Linux'
        run: 
         echo 'LUA_PATH="/usr/share/lua/5.5/?.lua"' >> $GITHUB_PATH
      - name: set lua path
        if: matrix.os == 'macos-15'
        run: 
         echo 'LUA_PATH="$(brew --prefix luarocks)/share/lua/5.5/?.lua"' >> $GITHUB_PATH
      - name: set lua path
        if: runner.os == 'Windows'
        run: 
          echo "C:\ProgramData\chocolatey\lib\luarocks\luarocks-2.4.4-win32\lua\?.lua;C:\ProgramData\chocolatey\lib\luarocks\luarocks-2.4.4-win32\lua\?\init.lua" >> $GITHUB_PATH

      - name: Install dependencies
        run: npm i
      
      - name: Run tests
        run: npm run test:inmemory
        # run: GIT_BRANCH=${GITHUB_REF:11} make ci
      

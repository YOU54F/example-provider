name: Build

on:
  push:
  workflow_dispatch:

env:
  PACT_BROKER_BASE_URL: https://test.pactflow.io
  PACT_BROKER_TOKEN: ${{ secrets.PACT_BROKER_TOKEN }}
  # PACT_BROKER_PUBLISH_VERIFICATION_RESULTS: true
  # GIT_COMMIT: ${{ github.sha }}
  # GITHUB_REF: ${{ github.ref }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [
            ubuntu-latest,
            ubuntu-22.04-arm,
            windows-11,
            windows-11-arm,
            macos-15-intel,
            macos-15
          ]
    steps:
      - uses: actions/checkout@v6
      
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      
      - name: Download and install Drift
        run: |
          npm install -g @pactflow/drift
          drift auth login
      
      - name: Install dependencies
        run: npm i
      
      - name: Run tests
        run: npm run test:inmemory
        # run: GIT_BRANCH=${GITHUB_REF:11} make ci
      
